<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Favicon -->
		<link rel="icon" href="%sveltekit.assets%/favicon.jpg" />

		<!-- Base SEO Meta Tags -->
		<meta name="author" content="Dimas Andhika" />
		<meta name="theme-color" content="#191919" />
		<meta name="color-scheme" content="dark light" />

		<!-- Apply the stored theme before first paint to avoid a light/dark flash.
		     Must stay in sync with the default in +layout.svelte (dark). -->
		<script>
			(function () {
				try {
					if ((localStorage.getItem('theme') || 'dark') === 'dark') {
						document.documentElement.classList.add('dark');
					}
				} catch (e) {
					document.documentElement.classList.add('dark');
				}
			})();
		</script>

		<!-- SvelteKit Head -->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
